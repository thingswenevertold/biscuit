[platformio]
default_envs = default
extra_configs = platformio.local.ini

[biscuit]
version = 0.1.0

[base]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
check_tool = cppcheck
check_flags = --enable=all --suppress=missingIncludeSystem --suppress=unusedFunction --suppress=unmatchedSuppression --suppress=*:*/.pio/* --suppress=*:*/freeink-sdk/* --inline-suppr
check_skip_packages = yes

board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_upload.offset_address = 0x10000

build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DEINK_DISPLAY_SINGLE_BUFFER_MODE=1
  -DDISABLE_FS_H_WARNING=1
  -DDESTRUCTOR_CLOSES_FILE=1
# https://libexpat.github.io/doc/api/latest/#XML_GE
  -DXML_GE=0
  -DXML_CONTEXT_BYTES=1024
  -std=gnu++2a
# Enable UTF-8 long file names in SdFat
  -DUSE_UTF8_LONG_NAMES=1
# PNG scanline buffer — sized for display width (800px) + small margin.
# Previous value 16416 allocated ~65KB on every decode and fragmented the heap,
# causing "memory error" when opening books on ESP32-C3 (380KB SRAM, no PSRAM).
# 3200 pixels = ~13KB buffer, plenty for our 800px-wide panel.
  -DPNG_MAX_BUFFERED_PIXELS=3200
  -Wno-bidi-chars
  -Wl,--wrap=panic_print_backtrace,--wrap=panic_abort,--wrap=ieee80211_raw_frame_sanity_check,--wrap=bootloader_common_check_efuse_blk_validity
  -fno-exceptions

build_unflags =
  -std=gnu++11
  -fexceptions

; Board configuration
board_build.flash_mode = dio
board_build.flash_size = 16MB
board_build.partitions = partitions.csv

extra_scripts =
  pre:scripts/build_html.py
  pre:scripts/gen_i18n.py
  pre:scripts/patch_jpegdec.py
  pre:scripts/git_branch.py

; Libraries
; Switched from open-x4-sdk to freeink-sdk (see freeink-sdk/docs) so every
; biscuit build target -- the original ESP32-C3 Xteink X4/X3 in [env:default]
; and the new ESP32-S3 Xteink X4 Pro in [env:x4pro] -- shares one SDK and one
; lib/hal implementation. freeink-sdk fully covers the C3 X4/X3 profiles (see
; its platformio.sample.ini [env:xteink]), so this is a lossless swap for the
; existing hardware, not just an addition for the new one.
lib_deps =
  BoardConfig=symlink://freeink-sdk/libs/hardware/BoardConfig
  BatteryMonitor=symlink://freeink-sdk/libs/hardware/BatteryMonitor
  InputManager=symlink://freeink-sdk/libs/hardware/InputManager
  EInkDisplay=symlink://freeink-sdk/libs/display/FreeInkDisplay
  SDCardManager=symlink://freeink-sdk/libs/hardware/SDCardManager
  PowerManager=symlink://freeink-sdk/libs/hardware/PowerManager
  XteinkDetect=symlink://freeink-sdk/libs/hardware/XteinkDetect
  bblanchon/ArduinoJson @ 7.4.2
  ricmoo/QRCode @ 0.0.1
  bitbank2/PNGdec @ ^1.0.0
  bitbank2/JPEGDEC @ ^1.8.0
  links2004/WebSockets @ 2.7.3

; NOTE -- flash headroom on the C3 envs (biscuit-x4pro-port follow-up):
; the freeink-sdk swap above pulled in the SDK's generalized multi-board
; BoardConfig/PowerManager/XteinkDetect/InputManager, which overflows the C3
; envs' existing 0x640000 (6.4MB) app partition by ~45KB (0.7%) at default
; optimization -- [env:default] measured 6598723 / 6553600 bytes. crosspoint-
; reader closes exactly this gap with a custom_sdkconfig Arduino-core rebuild
; ([firmware_tuned]/[firmware_tuned_c3] in its platformio.ini) that drops
; unused cloud components (esp_insights/esp_rainmaker/etc). That path was
; tried here and hit a Windows-specific PlatformIO/SCons packaging error
; (ModuleNotFoundError: SCons.Tool.FortranCommon) unrelated to this port --
; matches crosspoint's own comment that the feature needs a per-platform CMake
; pin. Left as a follow-up: fix the SCons env or trim ~45KB another way
; (LTO, dropping an unused lib_dep) rather than block the ESP32-S3 X4 Pro
; bring-up (this task's actual goal) on an unrelated Windows toolchain issue.

[env:default]
extends = base
build_flags =
  ${base.build_flags}
  ; CROSSPOINT_VERSION is set by scripts/git_branch.py (includes current branch)
  -DFREEINK_DEVICE_X4=1
  -DFREEINK_DEVICE_X3=1
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=2 ; Set log level to debug for development builds


[env:gh_release]
extends = base
build_flags =
  ${base.build_flags}
  -DFREEINK_DEVICE_X4=1
  -DFREEINK_DEVICE_X3=1
  -DCROSSPOINT_VERSION=\"${biscuit.version}\"
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=1 ; Set log level to info for release builds

[env:gh_release_rc]
extends = base
build_flags =
  ${base.build_flags}
  -DFREEINK_DEVICE_X4=1
  -DFREEINK_DEVICE_X3=1
  -DCROSSPOINT_VERSION=\"${biscuit.version}-rc+${sysenv.CROSSPOINT_RC_HASH}\"
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=1 ; Set log level to info for release candidate builds

[env:slim]
extends = base
build_flags =
  ${base.build_flags}
  -DFREEINK_DEVICE_X4=1
  -DFREEINK_DEVICE_X3=1
  -DCROSSPOINT_VERSION=\"${biscuit.version}-slim\"
  ; serial output is disabled in slim builds to save space
  -UENABLE_SERIAL_LOG

; --- Xteink X4 Pro -- ESP32-S3, 16MB flash / 8MB PSRAM, SSD1677 + GT911 -------
; Buttons-only bring-up for now (Left/Right/Power); touch (GT911 + capacitive
; Home key) lands in a follow-up task. See freeink-sdk/docs/xteink-x4pro-support.md
; for the hardware-verified pinout this profile is built from.
;   pio run -e x4pro -t upload
[env:x4pro]
extends = base
board = esp32-s3-devkitc1-n16r8
board_build.mcu = esp32s3
board_build.arduino.memory_type = dio_opi
build_flags =
  ${base.build_flags}
  -DFREEINK_DEVICE_X4PRO=1
  -DBOARD_HAS_PSRAM
  -DCROSSPOINT_VERSION=\"${biscuit.version}-x4pro\"
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=2
  ; X4 Pro SD is native SDMMC (1-bit), mounted through SdFat's block-device API.
  -DUSE_BLOCK_DEVICE_INTERFACE=1

[env:native]
platform = native
build_flags = -std=c++17 -DNATIVE_TEST -Itest/mocks
test_framework = unity

; ------------------------------------------------------------
; Interactive native emulator (Win32/GDI window driving REAL
; activity code from src/activities through the mock hardware
; layer). Builds a plain main() executable, not a unity test.
;   Build: pio run -e emulator
;   Run:   .pio/build/emulator/program.exe   (add Q=quit)
;   Test:  .pio/build/emulator/program.exe --selftest
; See docs/emulator.md.
; ------------------------------------------------------------
[env:emulator]
platform = native
; Disable the Library Dependency Finder: we supply every include via -I
; flags (shim -> mocks -> src) and compile an explicit file list, so we do
; NOT want PlatformIO auto-discovering/compiling the real lib/ libraries
; (GfxRenderer, hal, etc.) which need ESP32 headers.
lib_ldf_mode = off
lib_compat_mode = off
build_flags =
  -std=gnu++20
  -DEMULATOR_BUILD
  -Isrc/emulator/shim
  -Itest/mocks
  -Isrc
  -include emu_prelude.h
  -lgdi32
  -luser32
; Compile ONLY the emulator entry point plus the real activities that are
; currently wired up. To wire another activity, add its .cpp here AND update
; makeActivity() (or the ActivityManager stack demo) in src/emulator/main.cpp.
build_src_filter =
  -<*>
  +<emulator/>
  +<activities/apps/DiceRollerActivity.cpp>
  +<activities/apps/MinesweeperActivity.cpp>
  +<activities/apps/SnakeActivity.cpp>
  +<activities/apps/TetrisActivity.cpp>
  +<activities/apps/SudokuActivity.cpp>
  +<activities/apps/GameOfLifeActivity.cpp>
  +<activities/apps/ChessActivity.cpp>
  +<activities/apps/MazeActivity.cpp>
  +<activities/apps/VoronoiActivity.cpp>
  +<activities/apps/MatrixRainActivity.cpp>
  +<activities/apps/CalculatorActivity.cpp>
  +<activities/apps/UnitConverterActivity.cpp>
  +<activities/apps/OtpGeneratorActivity.cpp>
  +<activities/apps/CountdownActivity.cpp>
  +<activities/apps/EtchASketchActivity.cpp>
  +<activities/util/ConfirmationActivity.cpp>
  +<activities/util/FullScreenMessageActivity.cpp>
  +<util/ButtonNavigator.cpp>
  +<activities/util/KeyboardEntryActivity.cpp>
  +<activities/apps/MorseCodeActivity.cpp>
  +<activities/apps/CipherActivity.cpp>
  +<activities/apps/SteganographyActivity.cpp>
  +<activities/apps/HabitTrackerActivity.cpp>
  +<activities/apps/FlashcardActivity.cpp>
